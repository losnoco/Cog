name: Check if Cog builds for iOS
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build the iOS Cog.app
    runs-on: [self-hosted, macOS]
    env:
      XCODE_DERIVEDDATA_PATH: build-ios
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      # The runner's PATH may leave out Homebrew.
      - name: Set up cmake and ninja
        run: |
          if [ -x /opt/homebrew/bin/brew ]; then
            echo /opt/homebrew/bin >> "$GITHUB_PATH"
            export PATH="/opt/homebrew/bin:$PATH"
          fi
          for tool in cmake ninja; do
            command -v "$tool" || brew install "$tool"
          done
      # Xcode installs the iOS platform on demand; download it only when
      # its SDKs are missing, as it is several GB.
      - name: Install the iOS platform
        run: >
          { xcrun --sdk iphoneos --show-sdk-path && xcrun --sdk iphonesimulator --show-sdk-path; }
          || xcodebuild -downloadPlatform iOS -architectureVariant arm64
      # The sources are pinned by checksum in the script, so the script and
      # Cog's patches are all that decide the result.
      - name: Restore the libraries
        id: cache
        uses: actions/cache@v5
        with:
          path: ThirdParty/*/ios
          key: ios-libraries-${{ hashFiles('Scripts/build-ios-libraries.sh', 'ThirdParty/*/patches/**') }}
      - name: Build the libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: Scripts/build-ios-libraries.sh
      - name: Package the libraries
        run: >
          tar -cJf ios-libraries.tar.xz ThirdParty/*/ios
      - name: Upload the libraries
        uses: actions/upload-artifact@v6
        with:
          name: ios-libraries
          path: ios-libraries.tar.xz
      - name: Prepare the checkout
        run: iOS/prepare.sh
      - name: Run xcodebuild
        run: >
          xcodebuild
          -quiet
          -project iOS/MobileCog.xcodeproj
          -scheme Cog
          -configuration Debug
          -destination generic/platform=iOS
          -derivedDataPath $XCODE_DERIVEDDATA_PATH
          CODE_SIGNING_ALLOWED=NO
          build
